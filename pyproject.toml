[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repoviva-graph"
version = "0.1.0"
description = "Local-first GitHub repository portfolio intelligence and interview-question MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0,<3",
    "fastapi>=0.160,<1",
    "uvicorn[standard]>=0.30,<1",
    "requests>=2.32,<3",
    "python-dotenv>=1.0,<2",
    "scikit-learn>=1.5,<2",
    "pytest>=8,<10",
    "httpx>=0.27,<1",
]

[project.scripts]
repoviva-mcp = "repoviva.mcp_server:main"

[tool.setuptools.packages.find]
include = ["repoviva*"]

